<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Memory Decay dashboard" />
    <title>Memory Decay — Dashboard</title>
    <link rel="stylesheet" href="app.css" />
</head>

<body data-active="dashboard" data-root="."
    class="h-screen overflow-hidden bg-paper font-sans text-ink">
    <div class="grid h-screen min-h-[0] w-screen grid-rows-[86px_minmax(0,1fr)] overflow-hidden bg-paper">
        <div id="shared-header"></div>
        <div class="grid min-h-0 grid-cols-1 sm:grid-cols-[220px_minmax(0,1fr)]">
            <div id="shared-sidebar"></div>
            <main class="min-h-0 overflow-y-auto p-[18px] sm:p-7" aria-live="polite">
                <div class="grid gap-[18px]">
                    <div class="grid gap-[18px] lg:grid-cols-2">
                        <section
                            class="relative overflow-hidden rounded-2xl border border-line bg-white before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-[#d9dfd7]">
                            <div
                                class="flex items-center justify-between border-b border-dashed border-[#d9ddd7] px-[18px] py-[13px] pl-[22px]">
                                <h1 class="font-display text-[19px]">Upcoming Due <span
                                        class="text-[#758078]">›</span></h1>
                                <button type="button" data-popup="add" aria-label="Add concept"
                                    class="grid size-[38px] place-items-center rounded-[11px] border border-line bg-white text-lg transition hover:bg-soft">+</button>
                            </div>
                            <div id="dashboard-due" class="p-[18px] pl-[22px]">
                                <div class="py-3 text-sm text-muted">Loading concepts…</div>
                            </div>
                        </section>

                        <section
                            class="relative overflow-hidden rounded-2xl border border-line bg-white before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-[#d9dfd7]">
                            <div
                                class="flex items-center justify-between border-b border-dashed border-[#d9ddd7] px-[18px] py-[17px] pl-[22px]">
                                <h2 class="font-display text-[19px]">Status <span
                                        class="text-[#758078]">›</span></h2>
                                <span class="text-xs text-[#89918c]">Today</span>
                            </div>
                            <div id="dashboard-status" class="grid gap-[11px] p-[18px] pl-[22px]">
                                <div class="grid grid-cols-[1fr_auto] items-center gap-3">
                                    <div>
                                        <p class="text-[13px] font-semibold">Concepts tracked</p>
                                        <div class="mt-1.5 h-[7px] overflow-hidden rounded-full bg-[#edf0eb]">
                                            <div class="h-full w-0 rounded-full bg-sage"></div>
                                        </div>
                                    </div>
                                    <span class="text-xs text-muted">0</span>
                                </div>
                                <div class="grid grid-cols-[1fr_auto] items-center gap-3">
                                    <div>
                                        <p class="text-[13px] font-semibold">Reviews completed</p>
                                        <div class="mt-1.5 h-[7px] overflow-hidden rounded-full bg-[#edf0eb]">
                                            <div class="h-full w-0 rounded-full bg-sage"></div>
                                        </div>
                                    </div>
                                    <span class="text-xs text-muted">0</span>
                                </div>
                                <div class="grid grid-cols-[1fr_auto] items-center gap-3">
                                    <div>
                                        <p class="text-[13px] font-semibold">Average retention</p>
                                        <div class="mt-1.5 h-[7px] overflow-hidden rounded-full bg-[#edf0eb]">
                                            <div class="h-full w-0 rounded-full bg-sage"></div>
                                        </div>
                                    </div>
                                    <span class="text-xs text-muted">0%</span>
                                </div>
                            </div>
                        </section>
                    </div>

                    <section
                        class="relative min-h-[360px] overflow-hidden rounded-2xl border border-line bg-white before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-[#d9dfd7]">
                        <div
                            class="flex items-center justify-between border-b border-dashed border-[#d9ddd7] px-[18px] py-[17px] pl-[22px]">
                            <h2 class="font-display text-[19px]">Average retention <span
                                    class="text-[#758078]">›</span></h2>
                            <span class="text-xs text-[#89918c]">last 60 days</span>
                        </div>
                        <div id="dashboard-chart" class="px-[18px] pb-4 pt-1 sm:px-[22px]">
                            <div class="grid h-[280px] place-items-center text-center">
                                <div>
                                    <p class="font-display text-xl">No retention history</p>
                                    <p class="mt-1 text-sm text-muted">Complete a recall test to begin charting retention.</p>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <div id="shared-floating-ui"></div>
    <script src="javascripts/logic.js?v=storage-engine-1"></script>
    <script src="javascripts/main.js?v=ui-storage-1"></script>
</body>

</html>
