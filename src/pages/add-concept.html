<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Decay — Add Concept</title><link rel="stylesheet" href="../../app.css" />
</head>
<body data-active="concepts" data-root="../.." class="h-screen overflow-hidden bg-paper font-sans text-ink">
    <div class="grid h-screen min-h-0 w-screen grid-rows-[86px_minmax(0,1fr)] overflow-hidden">
        <div id="shared-header"></div>
        <div class="grid min-h-0 grid-cols-1 sm:grid-cols-[220px_minmax(0,1fr)]">
            <div id="shared-sidebar"></div>
            <main class="min-h-0 overflow-y-auto p-[18px] sm:p-7">
                <a href="concepts.html" class="mb-5 inline-flex text-sm text-muted hover:text-ink">‹ Back to concepts</a>
                <section class="mx-auto max-w-2xl rounded-2xl border border-line bg-white p-6">
                    <p class="text-[11px] font-bold uppercase tracking-[1.5px] text-[#8a928c]">Learning library</p>
                    <h1 class="mt-1 font-display text-3xl">Add a concept</h1>
                    <p class="mt-1 text-sm text-muted">Create a learning item to start tracking recall.</p>
                    <form class="mt-5 grid gap-4">
                        <label class="grid gap-1.5 text-xs font-bold">Title<input name="title" placeholder="e.g. JavaScript closures" class="rounded-[10px] border border-line bg-white px-3 py-3 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15" /></label>
                        <label class="grid gap-1.5 text-xs font-bold">Material<textarea name="material" rows="7" placeholder="Describe the idea, process, or facts to recall." class="resize-none rounded-[10px] border border-line bg-white px-3 py-3 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15"></textarea></label>
                        <label class="grid gap-1.5 text-xs font-bold">Keywords<input name="keywords" placeholder="closure, scope, function, lexical environment" class="rounded-[10px] border border-line bg-white px-3 py-3 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15" /></label>
                        <div class="mt-1 flex justify-end gap-2"><a href="concepts.html" class="rounded-[10px] border border-line bg-white px-4 py-2.5 text-sm font-medium">Cancel</a><a href="concept.html" class="rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Save concept</a></div>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <script src="../../src/scripts/components.js"></script>
</body>
</html>
