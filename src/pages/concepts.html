<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Decay — Concepts</title>
    <link rel="stylesheet" href="../../app.css" />
</head>
<body data-active="concepts" data-root="../.." data-page="concepts" class="h-screen overflow-hidden bg-paper font-sans text-ink">
    <div class="grid h-screen min-h-0 w-screen grid-rows-[86px_minmax(0,1fr)] overflow-hidden">
        <div id="shared-header"></div>
        <div class="grid min-h-0 grid-cols-1 sm:grid-cols-[220px_minmax(0,1fr)]">
            <div id="shared-sidebar"></div>
            <main class="min-h-0 overflow-y-auto p-[18px] sm:p-7">
                <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
                    <div>
                        <p class="text-[11px] font-bold uppercase tracking-[1.5px] text-[#8a928c]">Learning library</p>
                        <h1 class="mt-1 font-display text-3xl">Your concepts</h1>
                        <p class="mt-1 text-sm text-muted">Each item is tracked by observed recall over time.</p>
                    </div>
                    <button type="button" data-popup="add" class="rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white transition hover:bg-[#35483c]">+ Add concept</button>
                </div>
                <div class="mb-5 grid gap-3 rounded-2xl border border-line bg-white p-4 sm:grid-cols-[minmax(180px,1fr)_180px_180px]" role="search">
                    <label class="grid gap-1.5 text-xs font-bold" for="concept-search">Search
                        <input id="concept-search" data-concept-search type="search" placeholder="Search concepts" class="rounded-[10px] border border-line bg-white px-3 py-2.5 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15" />
                    </label>
                    <label class="grid gap-1.5 text-xs font-bold" for="concept-filter">Filter
                        <select id="concept-filter" data-concept-filter class="rounded-[10px] border border-line bg-white px-3 py-2.5 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15"><option value="all">All states</option><option value="new">New</option><option value="stable">Stable</option><option value="reinforcement-needed">Reinforcement needed</option><option value="at-risk">At risk</option></select>
                    </label>
                    <label class="grid gap-1.5 text-xs font-bold" for="concept-sort">Sort
                        <select id="concept-sort" data-concept-sort class="rounded-[10px] border border-line bg-white px-3 py-2.5 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15"><option value="due">Due soonest</option><option value="lowest">Lowest score</option><option value="newest">Newest</option></select>
                    </label>
                </div>
                <div class="mb-5 grid gap-3 sm:grid-cols-4">
                    <div class="rounded-xl border border-line bg-white p-4"><span class="inline-flex rounded-full bg-[#edf0eb] px-2.5 py-1 text-xs font-semibold text-muted">New</span><p data-state-count="new" class="mt-3 font-display text-2xl">0</p></div>
                    <div class="rounded-xl border border-line bg-white p-4"><span class="inline-flex rounded-full bg-[#dfeee1] px-2.5 py-1 text-xs font-semibold text-[#42624a]">Stable</span><p data-state-count="stable" class="mt-3 font-display text-2xl">0</p></div>
                    <div class="rounded-xl border border-line bg-white p-4"><span class="inline-flex rounded-full bg-[#f5ead5] px-2.5 py-1 text-xs font-semibold text-[#82633b]">Needs reinforcement</span><p data-state-count="reinforcement-needed" class="mt-3 font-display text-2xl">0</p></div>
                    <div class="rounded-xl border border-line bg-white p-4"><span class="inline-flex rounded-full bg-[#f4dfdc] px-2.5 py-1 text-xs font-semibold text-[#87554e]">At risk</span><p data-state-count="at-risk" class="mt-3 font-display text-2xl">0</p></div>
                </div>
                <div class="grid gap-4" data-concept-list>
                    <div data-concept-empty class="rounded-2xl border border-dashed border-line bg-white p-8 text-center">
                        <h2 class="font-display text-xl">No concepts yet</h2>
                        <p class="mt-2 text-sm text-muted">Add your first concept to begin building recall history.</p>
                        <button type="button" data-popup="add" class="mt-5 rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Add your first concept</button>
                    </div>
                </div>
                <div data-concept-empty data-no-match hidden class="rounded-2xl border border-dashed border-line bg-white p-8 text-center"><h2 class="font-display text-xl">No concepts found</h2><p class="mt-2 text-sm text-muted">Try changing the search or state filter.</p></div>
            </main>
        </div>
    </div>
    <div id="shared-floating-ui"></div>
    <script src="../../javascripts/logic.js?v=storage-engine-2"></script>
    <script src="../../javascripts/main.js?v=ui-recall-settings-2"></script>
</body>
</html>
