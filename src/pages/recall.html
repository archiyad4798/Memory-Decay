<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Complete a focused recall test in Memory Decay." />
    <meta name="theme-color" content="#405447" />
    <meta property="og:title" content="Memory Decay — Recall" />
    <meta property="og:description" content="Complete a focused recall test in Memory Decay." />
    <meta property="og:image" content="/og-image.svg" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Memory Decay — Recall Test</title><link rel="stylesheet" href="../../app.css" />
</head>
<body data-active="concepts" data-root="../.." data-page="recall" class="h-screen overflow-hidden bg-paper font-sans text-ink">
    <div class="grid h-screen min-h-0 w-screen grid-rows-[86px_minmax(0,1fr)] overflow-hidden">
        <div id="shared-header"></div>
        <div class="grid min-h-0 grid-cols-1 sm:grid-cols-[220px_minmax(0,1fr)]">
            <div id="shared-sidebar"></div>
            <main class="min-h-0 overflow-y-auto p-[18px] sm:p-7">
                <nav aria-label="Breadcrumb" class="mb-5 flex items-center gap-2 text-sm text-muted"><a href="concepts.html" class="hover:text-ink">Concepts</a><span aria-hidden="true">›</span><span aria-current="page" class="text-ink">Recall</span></nav>
                <div data-recall-empty hidden class="mx-auto max-w-2xl rounded-2xl border border-dashed border-line bg-white p-8 text-center"><h1 class="font-display text-2xl">No concept selected</h1><p class="mt-2 text-sm text-muted">Choose a concept before starting a recall test.</p><a href="concepts.html" class="mt-5 inline-flex rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Open concepts</a></div>
                <div data-recall-content class="mx-auto max-w-3xl">
                    <p class="text-[11px] font-bold uppercase tracking-[1.5px] text-[#8a928c]">Recall test</p>
                    <h1 class="mt-1 font-display text-3xl">Recall test</h1>
                    <section data-material-state class="mt-5 rounded-2xl border border-line bg-white p-6">
                        <div class="flex items-center justify-between"><h2 class="font-display text-xl">Locked material</h2><span class="rounded-full bg-[#edf0eb] px-2.5 py-1 text-xs font-semibold text-muted">Hidden until recall</span></div>
                        <p class="mt-4 rounded-xl bg-[#f7f8f4] p-5 text-sm leading-7 text-muted">Choose a concept to load its material before starting a recall test.</p>
                        <div class="mt-5 flex justify-end"><button type="button" data-lock-start class="rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Lock and start</button></div>
                    </section>
                    <section data-answer-state hidden class="mt-[18px] rounded-2xl border border-line bg-white p-6">
                        <label class="grid gap-2 text-xs font-bold" for="answer">Free recall<textarea id="answer" rows="7" placeholder="Write what you remember..." class="resize-none rounded-[10px] border border-line bg-white px-3 py-3 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15"></textarea></label>
                        <div class="mt-2 flex justify-between gap-3 text-xs text-muted"><span>Write in your own words</span><span data-character-count aria-live="polite">0 characters</span></div>
                        <div class="mt-5 flex justify-end"><button type="button" data-submit-recall disabled class="rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white disabled:cursor-not-allowed disabled:opacity-40">Submit recall</button></div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../../javascripts/logic.js?v=storage-engine-2"></script>
    <script type="module" src="../../javascripts/main.js?v=ui-recall-settings-2"></script>
</body>
</html>
