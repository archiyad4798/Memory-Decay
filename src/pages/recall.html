<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Decay — Recall Test</title><link rel="stylesheet" href="../../app.css" />
</head>
<body data-active="concepts" data-root="../.." class="h-screen overflow-hidden bg-paper font-sans text-ink">
    <div class="grid h-screen min-h-0 w-screen grid-rows-[86px_minmax(0,1fr)] overflow-hidden">
        <div id="shared-header"></div>
        <div class="grid min-h-0 grid-cols-1 sm:grid-cols-[220px_minmax(0,1fr)]">
            <div id="shared-sidebar"></div>
            <main class="min-h-0 overflow-y-auto p-[18px] sm:p-7">
                <a href="concept.html" class="mb-5 inline-flex text-sm text-muted hover:text-ink">‹ Back to concept</a>
                <div class="mx-auto max-w-3xl">
                    <p class="text-[11px] font-bold uppercase tracking-[1.5px] text-[#8a928c]">Recall test</p>
                    <h1 class="mt-1 font-display text-3xl">Photosynthesis</h1>
                    <section class="mt-5 rounded-2xl border border-line bg-white p-6">
                        <div class="flex items-center justify-between"><h2 class="font-display text-xl">Locked material</h2><span class="rounded-full bg-[#edf0eb] px-2.5 py-1 text-xs font-semibold text-muted">Hidden until recall</span></div>
                        <p class="mt-4 rounded-xl bg-[#f7f8f4] p-5 text-sm leading-7 text-muted">The material will remain hidden while you prepare. Recall the process, components, and by-products in your own words.</p>
                    </section>
                    <section class="mt-[18px] rounded-2xl border border-line bg-white p-6">
                        <label class="grid gap-2 text-xs font-bold" for="answer">Free recall<textarea id="answer" rows="7" placeholder="Write what you remember..." class="resize-none rounded-[10px] border border-line bg-white px-3 py-3 text-sm font-normal outline-none focus:border-sage focus:ring-4 focus:ring-sage/15"></textarea></label>
                        <div class="mt-5 flex justify-end"><a href="result.html" class="rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Submit recall</a></div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../src/scripts/components.js"></script>
</body>
</html>
