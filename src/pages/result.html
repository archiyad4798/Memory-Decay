<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Decay — Recall Result</title><link rel="stylesheet" href="../../app.css" />
</head>
<body data-active="concepts" data-root="../.." data-page="result" class="h-screen overflow-hidden bg-paper font-sans text-ink">
    <div class="grid h-screen min-h-0 w-screen grid-rows-[86px_minmax(0,1fr)] overflow-hidden">
        <div id="shared-header"></div>
        <div class="grid min-h-0 grid-cols-1 sm:grid-cols-[220px_minmax(0,1fr)]">
            <div id="shared-sidebar"></div>
            <main class="min-h-0 overflow-y-auto p-[18px] sm:p-7">
                <nav aria-label="Breadcrumb" class="mb-5 flex items-center gap-2 text-sm text-muted"><a href="concepts.html" class="hover:text-ink">Concepts</a><span aria-hidden="true">›</span><span aria-current="page" class="text-ink">Result</span></nav>
                <div data-result-empty hidden class="mx-auto max-w-2xl rounded-2xl border border-dashed border-line bg-white p-8 text-center"><h1 class="font-display text-2xl">No recall result</h1><p class="mt-2 text-sm text-muted">Complete a recall test to view a result.</p><a href="concepts.html" class="mt-5 inline-flex rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Open concepts</a></div>
                <div data-result-content class="mx-auto max-w-2xl">
                    <section class="rounded-2xl border border-line bg-white p-6">
                        <p class="text-[11px] font-bold uppercase tracking-[1.5px] text-[#8a928c]">Recall result</p>
                        <div class="mt-3 flex flex-wrap items-end justify-between gap-3"><div><h1 class="font-display text-4xl">Recall complete</h1><p class="mt-2 text-sm text-muted">No score available without a completed test.</p></div></div>
                        <div class="mt-6 flex justify-end"><a data-result-action href="../../index.html" class="rounded-[10px] bg-sage-dark px-4 py-2.5 text-sm font-medium text-white">Dashboard</a></div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../../javascripts/logic.js"></script>
    <script src="../../javascripts/main.js"></script>
</body>
</html>
